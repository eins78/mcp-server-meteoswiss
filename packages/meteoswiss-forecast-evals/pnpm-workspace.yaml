packages:
  - "."

# npx (the previous run mechanism, before this package got its own lockfile -- see PLAN.md
# "Q-B (revisited)") has no build-script gating, so the sweep that produced this suite's actual
# verdict ran with promptfoo's native build scripts (esbuild, sharp, onnxruntime-node, etc.)
# executed. pnpm blocks unapproved build scripts by default; approve the same set here so a
# standalone `pnpm install` matches that environment instead of silently diverging from it.
onlyBuiltDependencies:
  - "@playwright/browser-chromium"
  - "@swc/core"
  - esbuild
  - onnxruntime-node
  - protobufjs
  - sharp
