# MCP-vs-skills track — the same real-world weather questions answered two ways:
#   mcp/*    custom provider running an OpenRouter tool-calling loop against the LOCAL
#            meteoswiss-mcp server (all tools, real schemas, real JSON results)
#   skill/*  custom provider giving the model the meteoswiss-ogd SKILL.md + one guarded
#            bash tool (direct OGD HTTP access, bundled scripts)
#
# Test cases are generated by capture-ground-truth.ts from LIVE data immediately before
# each run (scripts/run-mcp-skills.sh orchestrates this) — so runs need --no-cache and
# results are only comparable within one run. Cost accounting comes from OpenRouter's
# usage.include (the providers sum it across loop iterations and enforce the budget cap
# in src/mcp-vs-skills/budget.ts).
#
# The axis under test is ACCESS METHOD; the two models are cheap-tier representatives
# with solid tool calling (see docs/results/ for the run writeups).

description: 'MCP server vs OGD skill — real-world weather Q&A (accuracy + tokens + cost)'

prompts:
  - |
    {{question}}

    End your reply with one line:
    FINAL_JSON: {{schemaHint}}

providers:
  - id: file://src/mcp-vs-skills/provider-mcp.ts
    label: mcp/haiku-4.5
    config:
      model: anthropic/claude-haiku-4.5
      maxTokens: 1024
  - id: file://src/mcp-vs-skills/provider-skill.ts
    label: skill/haiku-4.5
    config:
      model: anthropic/claude-haiku-4.5
      maxTokens: 1024
  # gpt-5-mini rejects disabling reasoning outright (see promptfooconfig.yaml's header);
  # effort:minimal is the lowest accepted. maxTokens is higher because hidden reasoning
  # tokens draw from the same completion budget.
  - id: file://src/mcp-vs-skills/provider-mcp.ts
    label: mcp/gpt-5-mini
    config: &gpt5mini
      model: openai/gpt-5-mini
      maxTokens: 4000
      extraBody:
        reasoning:
          effort: minimal
  - id: file://src/mcp-vs-skills/provider-skill.ts
    label: skill/gpt-5-mini
    config: *gpt5mini

tests: file://generated/mcp-skills-tests.json

outputPath: generated/results-mcp-skills.json
