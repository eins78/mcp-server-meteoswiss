# Programmatic (lookup) slice — the primary eval. See PLAN.md for the full design.
#
# Every test case is generated by `pnpm run generate` (src/generate-tests.ts) into
# generated/tests.json, which this file just points to. Ground truth is computed from the
# same fixture JSON the model is shown (src/ground-truth.ts) — nothing here is hand-typed.
#
# Cost controls (see PLAN.md "Cost controls"): every lookup-slice provider disables OpenRouter
# reasoning (`passthrough.reasoning.enabled: false`) and caps max_tokens — this is a "read the
# JSON and answer" task, not a task that should need extended thinking, and reasoning tokens
# are the single biggest threat to the $10 budget on 2026-era frontier models. Verify actual
# spend via OpenRouter's own generation/activity API, not just promptfoo's computed total —
# some models may ignore `reasoning.enabled: false` and still emit reasoning tokens.
#
# Root-caused from the 2026-07-09 full-sweep run (see HANDOFF.md): gpt-5-mini, gpt-5-nano and
# gemini-3.1-pro-preview reject `reasoning.enabled: false` outright (400 "Reasoning is mandatory
# for this endpoint and cannot be disabled"). gpt-5.2 doesn't reject it, but silently reserves a
# huge hidden reasoning-token budget instead of honoring `max_tokens: 256` (observed: "You
# requested up to 65536 tokens"), so it 402s on any account without a large real balance. All
# four get `reasoning.effort: 'minimal'` instead — the lowest budget these endpoints accept —
# rather than trying to disable reasoning entirely.
#
# Run: `pnpm run smoke` (1 cheap model, sanity check) then `pnpm run eval` (full sweep).
# API key: set OPENROUTER_API_KEY (env or .env) — see README.md.

description: 'meteoswissLocalForecast JSON comprehension — programmatic lookup slice'

prompts:
  - |
    You are given a JSON weather forecast object, as returned by a Swiss weather tool
    (MeteoSwiss "getLocalForecast"). Read it carefully, then answer the question using ONLY
    the JSON provided — do not use outside weather knowledge, and do not guess.

    FORECAST JSON:
    {{json_blob}}

    QUESTION:
    {{question}}

providers:
  # --- Frontier baselines (what consumers actually use) ---
  - id: openrouter:anthropic/claude-opus-4.8
    label: frontier/opus-4.8
    config: &lookup_config
      temperature: 0
      max_tokens: 256
      passthrough:
        reasoning:
          enabled: false
  - id: openrouter:anthropic/claude-sonnet-5
    label: frontier/sonnet-5
    config: *lookup_config
  - id: openrouter:openai/gpt-5.2
    label: frontier/gpt-5.2
    config: &lookup_config_reasoning_mandatory
      temperature: 0
      max_tokens: 256
      passthrough:
        reasoning:
          effort: minimal
  - id: openrouter:google/gemini-3.1-pro-preview
    label: frontier/gemini-3.1-pro
    # Own config, NOT *lookup_config_reasoning_mandatory: the 2026-07-09 full sweep found this
    # provider leaks visible "Thinking: ..." text into the completion even at
    # reasoning.effort:'minimal', which under the shared 256-token budget truncated its JSON
    # answer mid-response on ~1/3 of calls (see PLAN.md "Full sweep results, complete" for the
    # trace). Bumped max_tokens only for this provider so the leaked reasoning text doesn't
    # crowd out the answer -- the other three models sharing the mandatory-reasoning anchor
    # (gpt-5.2, gpt-5-mini, gpt-5-nano) scored 100%/100%/67% local with the 256 budget and
    # don't need this.
    config:
      temperature: 0
      max_tokens: 1024
      passthrough:
        reasoning:
          effort: minimal
  - id: openrouter:mistralai/mistral-large-2512
    label: frontier/mistral-large
    config: *lookup_config

  # --- Cheap / mainstream tier ---
  - id: openrouter:anthropic/claude-haiku-4.5
    label: cheap/haiku-4.5
    config: *lookup_config
  - id: openrouter:openai/gpt-5-mini
    label: cheap/gpt-5-mini
    config: *lookup_config_reasoning_mandatory
  - id: openrouter:google/gemini-3.1-flash-lite
    label: cheap/gemini-3.1-flash-lite
    config: *lookup_config
  - id: openrouter:mistralai/mistral-medium-3.1
    label: cheap/mistral-medium-3.1
    config: *lookup_config

  # --- Tiny tier — THE GATE BLOCK. Real end-users run these. tiny x {local, utc} accuracy
  # is what decides whether PR #99's local-time format ships as-is. ---
  - id: openrouter:openai/gpt-5-nano
    label: tiny/gpt-5-nano
    config: *lookup_config_reasoning_mandatory
  - id: openrouter:google/gemini-2.5-flash-lite
    label: tiny/gemini-2.5-flash-lite
    config: *lookup_config
  - id: openrouter:mistralai/ministral-8b-2512
    label: tiny/ministral-8b
    config: *lookup_config
  - id: openrouter:meta-llama/llama-3.3-70b-instruct
    label: tiny/llama-3.3-70b
    config: *lookup_config

  # --- Apertus (Swiss) — OPTIONAL, not on OpenRouter (confirmed absent as of 2026-07).
  # Runs locally via Ollama; plain-chat only (tool-calling template is broken, irrelevant here
  # since every prompt above is plain chat). Uncomment if Ollama is running locally with the
  # model pulled (`ollama pull apertus` or the appropriate tag). Left out of the default run
  # so `pnpm run eval` doesn't fail for anyone without a local Ollama instance.
  # - id: ollama:chat:apertus
  #   label: swiss/apertus-local
  #   config:
  #     temperature: 0

  # --- Dry-run only: promptfoo's built-in zero-cost provider, echoes the prompt back as the
  # "response" (so every assertion legitimately fails — that's expected). Used by
  # `pnpm run dryrun` via `--filter-providers echo` to validate the pipeline wiring
  # (test generation -> config -> scorer -> results file) without spending anything. Never
  # included in `pnpm run eval` / `pnpm run smoke`, which filter it out or select real models.
  - id: echo
    label: debug/echo

# Each generated test case already declares its own `assert` (pointing at src/scorer.ts with
# that test's expectedJson baked into vars) — no defaultTest.assert here, to avoid grading
# every response twice.
# scorer.ts is plain TypeScript, no build step: promptfoo just does a dynamic import() on the
# file:// path, which on this repo's pinned Node version (24.18, see .nvmrc) resolves through
# Node's own native TS type-stripping. See scorer.ts's header comment for the full story.
tests: file://generated/tests.json

outputPath: generated/results.json
