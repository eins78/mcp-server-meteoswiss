name: Version Packages

on:
  push:
    branches: [main]

concurrency:
  group: version-packages
  cancel-in-progress: false

env:
  NODE_VERSION: 24

jobs:
  version:
    name: Create Version PR
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update version PR
        id: changesets
        uses: changesets/action@c8bada60c408975afd1a20b3db81d6eee6789308 # v1
        with:
          title: 'Version Packages'
          commit: 'I: Version packages'
          # `pnpm run version` = `changeset version` + syncs meteoswiss-skills'
          # bumped version into its plugin/marketplace manifests and SKILL.md
          # + stamps release dates onto the new CHANGELOG headers.
          version: pnpm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set dynamic Version Packages PR title
        # Only runs when changesets/action actually created/updated a PR —
        # a push with no pending changesets leaves pullRequestNumber unset.
        if: steps.changesets.outputs.pullRequestNumber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          git fetch origin changeset-release/main
          .github/scripts/compute-version-pr-title.sh origin/changeset-release/main "$PR_NUMBER"
