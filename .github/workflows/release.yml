name: Release MCP Server

on:
  release:
    types: [published]

concurrency:
  group: release-mcp
  cancel-in-progress: false

env:
  DOCKER_IMAGE: ghcr.io/eins78/meteoswiss-mcp
  NODE_VERSION: 24
  PACKAGE_DIR: packages/meteoswiss-mcp

jobs:
  ci:
    name: CI Validation
    if: startsWith(github.event.release.tag_name, 'meteoswiss-mcp-v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter meteoswiss-mcp run lint

      - name: Build
        run: pnpm --filter meteoswiss-mcp run build

      - name: Test
        run: pnpm --filter meteoswiss-mcp test
        env:
          USE_TEST_FIXTURES: 'true'
          NODE_OPTIONS: '--experimental-vm-modules'

      - name: Integration tests
        run: pnpm --filter meteoswiss-mcp run test:integration
        env:
          USE_TEST_FIXTURES: 'true'
          NODE_OPTIONS: '--experimental-vm-modules'

  publish-npm:
    name: Publish to npm
    if: startsWith(github.event.release.tag_name, 'meteoswiss-mcp-v')
    runs-on: ubuntu-latest
    needs: ci
    environment: npm

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#meteoswiss-mcp-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter meteoswiss-mcp run build

      - name: Set package version
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "${{ steps.version.outputs.version }}" ]; then
            npm version "${{ steps.version.outputs.version }}" --no-git-tag-version
          else
            echo "Version already set to $CURRENT"
          fi

      - name: Publish to npm
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            npm publish --access public --provenance --tag next
          else
            npm publish --access public --provenance
          fi

  publish-docker:
    name: Publish to GHCR
    if: startsWith(github.event.release.tag_name, 'meteoswiss-mcp-v')
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#meteoswiss-mcp-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set package version from tag
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "${{ steps.version.outputs.version }}" ]; then
            npm version "${{ steps.version.outputs.version }}" --no-git-tag-version
          else
            echo "Version already set to $CURRENT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags
        id: docker-tags
        run: |
          TAGS="${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }}"
          if [[ "${{ steps.version.outputs.prerelease }}" == "false" ]]; then
            TAGS="${TAGS},${{ env.DOCKER_IMAGE }}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ env.PACKAGE_DIR }}
          file: ${{ env.PACKAGE_DIR }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
