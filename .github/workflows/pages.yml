name: Deploy Docs Site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/meteoswiss-forecast-evals/docs/results/**'
      - 'packages/meteoswiss-docs-site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer push should win over an in-flight older one
# rather than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Starlight site
        uses: withastro/action@v6
        with:
          path: packages/meteoswiss-docs-site
          node-version: 24
          package-manager: pnpm@10.34.5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
